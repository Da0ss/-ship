<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Уведомление о расходах по карте — проверка требований</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Serif:wght@400;700&family=PT+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFCFD; --desk:#EEF1F5; --ink:#1C2430; --slate:#5B6878; --rule:#D9DEE5;
  --crit:#B4233C; --crit-bg:#FBE9EC; --major:#A86400; --major-bg:#FDF2E0;
  --minor:#3C6E9F; --minor-bg:#E8F0F8; --bank:#0F7B6C; --bank-bg:#E2F3F0;
  --sans:"PT Sans","Segoe UI",system-ui,sans-serif; --serif:"PT Serif",Georgia,serif;
  --mono:"PT Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.5 var(--sans);color:var(--ink);background:var(--desk);display:flex;flex-direction:column}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--minor);outline-offset:2px}

header.top{background:var(--paper);border-bottom:1px solid var(--rule);padding:14px 24px 0}
.top h1{font:700 22px/1.25 var(--serif);margin:0 0 6px;max-width:60ch}
.verdict{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin:0 0 10px}
.verdict .state{font-weight:700;padding:2px 10px;border-radius:3px;color:#fff;background:var(--crit)}
.verdict .state.ok{background:var(--bank)}
.verdict .sum{color:var(--slate);max-width:90ch}
.tally{display:flex;gap:18px;flex-wrap:wrap;margin:0 0 10px;color:var(--slate)}
.tally b{color:var(--ink);font-size:18px}
.tally .c b{color:var(--crit)} .tally .m b{color:var(--major)} .tally .n b{color:var(--minor)} .tally .k b{color:var(--bank)}
.meta{font-size:13px;color:var(--slate);margin-bottom:8px;display:flex;flex-wrap:wrap;gap:2px 16px}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;color:var(--slate)}
nav.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--ink);font-weight:700}
nav.tabs .cnt{font-size:12px;color:var(--slate);margin-left:4px}

main{flex:1;min-height:0;display:flex}
.view{display:none;flex:1;min-height:0}
.view.on{display:flex}

/* document + notes */
#v-notes{gap:0}
.docwrap{position:relative;flex:1 1 58%;min-width:0;display:flex}
.minimap{width:14px;flex:none;position:relative;background:var(--paper);border-right:1px solid var(--rule);cursor:pointer}
.minimap i{position:absolute;left:2px;right:2px;height:3px;border-radius:1px}
.minimap .eye{position:absolute;left:0;right:0;border:1px solid var(--slate);background:rgba(91,104,120,.08);pointer-events:none}
.doc{flex:1;overflow:auto;background:var(--paper);padding:18px 0 40vh}
.ln{display:grid;grid-template-columns:52px 6px 1fr;align-items:start;font:15px/1.6 var(--serif);border-left:0}
.ln .no{font:12px/2 var(--sans);color:#9AA5B3;text-align:right;padding-right:10px;user-select:none}
.ln .bar{align-self:stretch}
.ln .tx{padding:0 28px 0 12px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:88ch}
.ln.h .tx{font-weight:700;font-size:17px;padding-top:6px}
.ln.h1 .tx{font-size:21px}
.ln.t .tx{font:14px/1.5 var(--sans);color:#303A47;display:flex;flex-wrap:wrap;gap:0}
.ln.t .cell{flex:1 1 0;min-width:90px;padding:3px 10px 3px 0;border-bottom:1px solid #EEF1F5}
.ln.t .cell:first-child{flex:0 1 220px;color:var(--slate)}
.ln.sep .tx{height:1px;background:var(--rule);margin:2px 28px 2px 12px;padding:0}
.ln.sep .no{line-height:1;font-size:10px}
.tx code{font:13px var(--mono);background:var(--desk);padding:0 3px;border-radius:2px}
.ln.mk{cursor:pointer}
.ln.mk.critical .bar{background:var(--crit)} .ln.mk.critical .tx{background:var(--crit-bg)}
.ln.mk.major .bar{background:var(--major)} .ln.mk.major .tx{background:var(--major-bg)}
.ln.mk.minor .bar{background:var(--minor)} .ln.mk.minor .tx{background:var(--minor-bg)}
.ln.mk .no{color:var(--ink);font-weight:700}
.ln.flash .tx{box-shadow:inset 0 0 0 2px var(--ink)}
.ln.pick .tx{box-shadow:inset 0 0 0 2px var(--minor)}

.notes{flex:1 1 42%;min-width:340px;max-width:620px;display:flex;flex-direction:column;border-left:1px solid var(--rule);background:var(--desk)}
.filters{padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-bottom:1px solid var(--rule);background:var(--paper)}
.chip{border:1px solid var(--rule);background:var(--paper);border-radius:14px;padding:2px 10px;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.filters input{flex:1 1 140px;min-width:120px;border:1px solid var(--rule);border-radius:4px;padding:4px 8px;font:inherit;font-size:13px}
.pickinfo{width:100%;font-size:13px;color:var(--slate);display:none}
.pickinfo.on{display:block}
.pickinfo button{border:0;background:none;color:var(--minor);text-decoration:underline;cursor:pointer;padding:0}
.list{overflow:auto;padding:10px 14px 40vh;flex:1}
.note{background:var(--paper);border:1px solid var(--rule);border-left-width:4px;border-radius:3px;padding:10px 12px;margin:0 0 10px;cursor:pointer}
.note.critical{border-left-color:var(--crit)} .note.major{border-left-color:var(--major)} .note.minor{border-left-color:var(--minor)}
.note.sel{outline:2px solid var(--ink)}
.note .hd{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;font-size:13px;margin-bottom:4px}
.note .sev{font-weight:700}
.note.critical .sev{color:var(--crit)} .note.major .sev{color:var(--major)} .note.minor .sev{color:var(--minor)}
.note .kind{font-weight:700}
.tag{font-size:12px;border-radius:3px;padding:0 6px;background:var(--desk);color:var(--slate)}
.tag.bank{background:var(--bank-bg);color:var(--bank);font-weight:700}
.tag.q{background:#EFE8F7;color:#5B3A8C}
.note .where{margin-left:auto;color:var(--slate)}
.note p{margin:4px 0}
.note q{font-family:var(--serif);quotes:"«" "»";color:#303A47}
.note .fix{border-top:1px dashed var(--rule);margin-top:6px;padding-top:6px}
.note .fix b{font-weight:700}
.note .opts{list-style:none;margin:4px 0 0;padding-left:4px}
.note .opts li{margin:2px 0;padding-left:22px;text-indent:-22px}
.opt{font-weight:700;display:inline-block;width:22px;text-indent:0}
.empty{color:var(--slate);padding:20px 4px}

/* tables & lists in other tabs */
.page{flex:1;overflow:auto;padding:20px 24px 60px;background:var(--paper)}
.page h2{font:700 19px/1.3 var(--serif);margin:0 0 6px}
.page .lead{color:var(--slate);max-width:90ch;margin:0 0 14px}
table.grid{border-collapse:collapse;width:100%;font-size:14px}
table.grid th{text-align:left;font-weight:700;border-bottom:2px solid var(--ink);padding:6px 8px;vertical-align:bottom}
table.grid td{border-bottom:1px solid var(--rule);padding:7px 8px;vertical-align:top}
.st{font-weight:700;white-space:nowrap}
.st.no{color:var(--crit)} .st.yes{color:var(--bank)} .st.na{color:var(--slate)}
a.goto{color:var(--minor);cursor:pointer;text-decoration:underline;white-space:nowrap}
.qlist{max-width:100ch;padding-left:24px}
.qlist li{margin:0 0 14px}
.qlist ul{margin:4px 0 0;padding-left:20px;list-style:none}
.qlist ul li{margin:2px 0}


@media (max-width:600px){
  header.top{padding:10px 14px 0}
  .verdict .sum{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .tally{gap:4px 12px;font-size:13px} .tally b{font-size:15px}
  .meta{display:none}
  nav.tabs{flex-wrap:nowrap;overflow-x:auto}
  nav.tabs button{white-space:nowrap}
}
@media (max-width:900px){
  #v-notes{flex-direction:column}
  .docwrap{flex:none;height:50vh}
  .notes{max-width:none;min-width:0;border-left:0;border-top:1px solid var(--rule)}
}
@media (prefers-reduced-motion:no-preference){
  .ln .tx{transition:box-shadow .25s}
}
</style>
</head>

_ids": ["R-32"]}, "reason": "Параметр cardId является внутренним системным идентификатором карты, а не номером банковской карты (PAN), поэтому PCI DSS к нему не применяется."}, {"violation": {"scope": "requirement", "defect": "gap", "severity": "major", "criterion": "ISO/IEC/IEEE 29148 5.2.5 — Полнота", "criterion_raw": "5.2.5", "quote": "В расходы входят проведённые покупки.", "location": {"line_start": 38, "line_end": 38, "page": null}, "quote2": null, "location2": null, "explanation": "Не указан порядок учета операций в иностранной валюте по карте KZT: по какому курсу (авторизации или клиринга) и правилу округления тиынов конвертированная сумма учитывается в расходах месяца.", "fix": "По какому курсу и правилу округления суммируются операции в иностранной валюте?", "fix_type": "question", "options": ["По курсу конвертации банка на момент клиринга с математическим округлением до тиынов", "По курсу авторизации операции с округлением до целых тенге в большую сторону"], "tag": "fintech", "also_at": [], "req_ids": ["R-06"]}, "reason": "Конвертация валют выполняется процессингом до передачи суммы в сервис расходов, поэтому эти правила не требуются для разработки данной функции."}, {"violation": {"scope": "set", "defect": "gap", "severity": "minor", "criterion": "ISO/IEC/IEEE 29148 5.2.6 — Полнота", "criterion_raw": "5.2.6", "quote": "Реализация задачи/проекта предусматривает схему отката решений", "location": {"line_start": 76, "line_end": 76, "page": null}, "quote2": null, "location2": null, "explanation": "В документе отсутствует план отката функционала и применение feature flag: не определено поведение процессинга и сервиса расходов при аварийном отключении сервиса push.", "fix": "Каков план отката решения и поведение систем при выключении feature flag?", "fix_type": "question", "options": ["При выключенном feature flag сервис расходов игнорирует события процессинга и прекращает расчет расходов", "Сервис расходов продолжает накапливать расходы в БД, но отключает вызов push-сервиса"], "tag": "fintech", "also_at": [], "req_ids": []}, "reason": "План отката релиза и использование feature flag относятся к процедурам развертывания и не требуются в спецификации требований к функции."}]}, "dropped_violations": 0, "merged_duplicates": 9, "coverage_gaps": [], "checklist": {"source": "document", "items": [{"item": "Техническое требование зафиксировано и покрывает бизнес-требование", "status": "no", "evidence": "Технические требования не покрывают бизнес-требование и противоречат цели уведомления в момент покупки (замечание R-01).", "quote": "Дать клиенту возможность узнать о достижении личного бюджета в момент покупки.", "location": {"line_start": 23, "line_end": 23, "page": null}, "refs": ["R-01"]}, {"item": "Функциональная спецификация имеет структурированное описание (по стандарту, шаблону)", "status": "no", "evidence": "Спецификация оформлена с нарушением стандарта: у большинства требований отсутствуют идентификаторы и приоритеты (замечания R-01..R-12).", "quote": "Документ (версия/дата) в источнике не заполнен. Пункты чек-листа приведены как в шаблоне, отметки не проставлены.", "location": {"line_start": 68, "line_end": 68, "page": null}, "refs": ["R-01", "R-02", "R-03", "R-04", "R-09", "R-10", "R-11", "R-12"]}, {"item": "Sequence-диаграммы, предусмотрены взаимодействия систем, компонентов и решений", "status": "no", "evidence": "В Sequence-диаграмме пропущены передача признака активности уведомлений и связь между сервисами (замечания R-02, R-09).", "quote": "Процессинг → сервис расходов: проведена покупка. Сервис расходов → настройки: получить порог карты.", "location": {"line_start": 43, "line_end": 43, "page": null}, "refs": ["R-02", "R-09"]}, {"item": "Требование покрывает спецификацию UX/UI дизайна", "status": "no", "evidence": "Спецификация UI не содержит текстов ошибок, условий валидации полей и поведения переключателя (замечание R-03).", "quote": "При ошибке ввода сообщение появляется под полем.", "location": {"line_start": 29, "line_end": 29, "page": null}, "refs": ["R-03"]}, {"item": "Реализация задачи/проекта предусматривает схему отката решений", "status": "no", "evidence": "В документе отсутствует описание схемы отката решений или вариантов скрытия функционала.", "quote": null, "location": null, "refs": []}, {"item": "Требование может быть протестировано", "status": "no", "evidence": "Нефункциональные требования и критерии приёмки содержат непроверяемые формулировки без измеримых метрик (замечания R-10, R-47).", "quote": "Сервис передаёт push на отправку в течение минуты после получения события.", "location": {"line_start": 46, "line_end": 46, "page": null}, "refs": ["R-10", "R-47"]}, {"item": "Требование предусматривает модель данных или поток, содержит описание", "status": "no", "evidence": "Модель данных неполная: отсутствуют типы данных, сущности и обязательный признак включения уведомления (замечание R-11).", "quote": "Хранить идентификатор карты, месяц, идентификатор операции, сумму покупки в тиынах, признак отправки и порог в тенге.", "location": {"line_start": 49, "line_end": 49, "page": null}, "refs": ["R-11"]}, {"item": "Требование не имеет противоречий или явных показателей операционных рисков", "status": "no", "evidence": "Требования содержат критические противоречия в правилах учёта операций, отправки push и контрактах API (замечания R-01, R-06, R-07, R-16, R-37).", "quote": "Месяц определяется по дате совершения покупки в Алматы.", "location": {"line_start": 38, "line_end": 38, "page": null}, "refs": ["R-01", "R-06", "R-07", "R-16", "R-37"]}, {"item": "Требование содержит архитектуру и согласовано с архитекторами", "status": "no", "evidence": "Архитектурная схема содержит противоречия с Sequence-диаграммой, а блок согласующих лиц не заполнен (замечание R-02 и строка 87).", "quote": "Мобильное приложение → сервис настроек. Карточный процессинг → учёт расходов → сервис push.", "location": {"line_start": 26, "line_end": 26, "page": null}, "refs": ["R-02"]}, {"item": "Все изменения, влияющие на иные продукты/системы в требовании, согласованы с ответственными лицами", "status": "no", "evidence": "Изменения затрагивают процессинг и сервис уведомлений, однако блок согласования с ответственными лицами пуст (строки 19, 87-91).", "quote": "Мобильный банк, карточный процессинг, сервис уведомлений", "location": {"line_start": 19, "line_end": 19, "page": null}, "refs": []}, {"item": "Структура требований не несёт изменений и рисков информационной безопасности", "status": "no", "evidence": "Метод сохранения спроектирован через HTTP GET с передачей параметров карты в строке URL, что создаёт риски ИБ (замечания R-17, R-22).", "quote": "curl -G \"$BASE/alerts/saveLimit\" -H \"Authorization: Bearer $TOKEN\" --data 'cardId=demo-42&amount=50000&enabled=1'", "location": {"line_start": 109, "line_end": 109, "page": null}, "refs": ["R-17", "R-22"]}, {"item": "В требовании присутствует схема полного бизнес-процесса и часть реализуемой доработки", "status": "no", "evidence": "Схема процесса представлена одной строкой и не описывает ветки возвратов, исключения операций и отключённых push (замечание R-04).", "quote": "Проведение покупки → пересчёт расходов → проверка порога → при достижении отправка push → завершение.", "location": {"line_start": 34, "line_end": 34, "page": null}, "refs": ["R-04"]}, {"item": "Требование носит интеграционный характер и имеет четкую постановку реализации интеграционного взаимодействия", "status": "no", "evidence": "Интеграционное взаимодействие противоречиво: метод чтения не описан, а для сохранения задан неверный HTTP-метод GET (замечания R-12, R-16, R-17).", "quote": "Приложение читает и сохраняет настройки через дочерний документ «Уведомление о расходах по карте — REST API».", "location": {"line_start": 52, "line_end": 52, "page": null}, "refs": ["R-12", "R-16", "R-17"]}, {"item": "Поддерживается версионность документа / зафиксирована", "status": "no", "evidence": "Версионность документа не поддерживается, номер версии и дата в документе не заполнены (строка 68).", "quote": "Документ (версия/дата) в источнике не заполнен.", "location": {"line_start": 68, "line_end": 68, "page": null}, "refs": []}]}, "verdict": {"ready_for_development": false, "ready_for_testing": false, "summary": "Документ содержит критическое количество нерешенных дефектов, включая 31 критическое нарушение. Основные проблемы связаны с противоречиями в API-методах (использование GET для изменения данных), критическими пробелами в логике обработки транзакций и валют, а также несоответствием схем данных и кодов ответов. Начинать разработку и тестирование в текущем состоянии невозможно.", "fix_first": ["(R-16, R-17, R-22) Исправить HTTP-метод для эндпоинта сохранения настроек с GET на POST/PUT и привести примеры cURL в соответствие со спецификацией.", "(R-05, R-24, R-32) Дописать требования к проверке активности карты и её валюты (строго KZT), а также определить коды ошибок при нарушении этих условий.", "(R-06, R-07) Устранить противоречия в правилах определения месяца транзакции, учете возвратов и лимитах на отправку push-уведомлений за календарный месяц.", "(R-09, R-10, R-11) Детализировать структуру хранения данных в БД, состав передаваемых параметров в сервис push и точные тайминги доставки.", "(R-35, R-37, R-38, R-42) Привести в соответствие заголовки запросов, список возможных HTTP-статусов (убрать несуществующий 201, описать 404) и формат возвращаемых полей (result, amount, enabled, message).", "(R-03, R-25, R-28) Зафиксировать точные тексты ошибок валидации полей, диапазоны значений и момент срабатывания проверок на фронтенде и бэкенде."]}}, "lines": [[1, "# Уведомление о расходах по карте", null], [2, "", null], [3, "Комплект из двух исходных документов. Текст требований не вычитывался и не исправлялся.  ", null], [4, "Часть B — дочерняя спецификация, на которую ссылается раздел интеграции в части A.", null], [5, "", null], [6, "---", null], [7, "", null], [8, "## Часть A. Новый функционал", null], [9, "", null], [10, "### Общие сведения", null], [11, "", null], [12, "| Поле | Значение |", null], [13, "| :--- | :--- |", null], [14, "| **Наименование задачи** | Месячный порог расходов по карте |", null], [15, "| **Продукт** | Мобильный банк, учебный кейс |", null], [16, "| **Бизнес-процесс** | Информирование держателя карты |", null], [17, "| **Business owner / Product owner / Аналитик** | Учебные роли розничного бизнеса, владельца мобильного банка и аналитика команды |", null], [18, "| **Тип работы** | Новый функционал |", null], [19, "| **Влияние на ИС** | Мобильный банк, карточный процессинг, сервис уведомлений |", null], [20, "| **Задача в JIRA** | Практикум без Jira-задачи |", null], [21, "", null], [22, "### Цели", null], [23, "Дать клиенту возможность узнать о достижении личного бюджета в момент покупки.", null], [24, "", null], [25, "### Архитектура решения", null], [26, "Мобильное приложение → сервис настроек. Карточный процессинг → учёт расходов → сервис push.", null], [27, "", null], [28, "### Дизайн процесса UI", null], [29, "Карты → Расходы → Уведомления. На экране видны переключатель, поле «Порог, ₸», сумма за месяц и кнопка «Сохранить». При ошибке ввода сообщение появляется под полем.", null], [30, "", null], [31, "### Требования к изменениям", null], [32, "", null], [33, "#### BPMN схема процесса", null], [34, "Проведение покупки → пересчёт расходов → проверка порога → при достижении отправка push → завершение.", null], [35, "", null], [36, "#### Функциональные требования", null], [37, "* **Ф-1.** Держатель активной карты KZT задаёт целый порог от 1 000 до 1 000 000 ₸ включительно. По умолчанию уведомление выключено.", null], [38, "* **Ф-2.** Месяц определяется по дате совершения покупки в Алматы. В расходы входят проведённые покупки. Возврат уменьшает расходы месяца исходной покупки. Переводы и снятие наличных исключаются.", null], [39, "* **Ф-3.** Когда расходы переходят от суммы ниже порога к сумме, равной порогу или выше, клиент получает push. На карту приходится максимум один такой push за календарный месяц.", null], [40, "* **Ф-4.** При изменении порога накопленная сумма сохраняется. Если она ниже нового порога, следующее достижение вызывает push независимо от истории предыдущей настройки.", null], [41, "", null], [42, "### Sequence Diagram", null], [43, "Процессинг → сервис расходов: проведена покупка. Сервис расходов → настройки: получить порог карты. Сервис расходов → push: передать последние четыре цифры карты и сумму при достижении порога.", null], [44, "", null], [45, "### Нефункциональные требования", null], [46, "Сервис передаёт push на отправку в течение минуты после получения события.", null], [47, "", null], [48, "### Требования к данным", null], [49, "Хранить идентификатор карты, месяц, идентификатор операции, сумму покупки в тиынах, признак отправки и порог в тенге.", null], [50, "", null], [51, "### Требования к интеграции", null], [52, "Приложение читает и сохраняет настройки через дочерний документ «Уведомление о расходах по карте — REST API». Повторная доставка одного события процессинга сохраняет исходный итог.", null], [53, "", null], [54, "### Требования к тестированию", null], [55, "", null], [56, "#### Тестирование требований", null], [57, "заполняются тестировщиками", null], [58, "", null], [59, "### Критерии приемки", null], [60, "", null], [61, "| Исходные условия | Действие | Ожидаемый результат |", null], [62, "| :--- | :--- | :--- |", null], [63, "| Расходы 48 500 ₸, порог 50 000 ₸ | Провести покупку на 1 500 ₸ | Итог 50 000 ₸ и один push |", null], [64, "| Покупка 31 января в 23:58 на 4 000 ₸ | Провести 1 февраля в 00:03 по Алматы | Февральский счётчик вырос на 4 000 ₸ |", null], [65, "| Расходы 19 900 ₸, порог 20 000 ₸ | Перевести 500 ₸ | Счётчик показывает 19 900 ₸ |", null], [66, "", null], [67, "### Ревью требований", null], [68, "Документ (версия/дата) в источнике не заполнен. Пункты чек-листа приведены как в шаблоне, отметки не проставлены.", null], [69, "", null], [70, "| Проверка | Создано или доступно | Проверено | Примечания |", null], [71, "| :--- | :--- | :--- | :--- |", null], [72, "| Техническое требование зафиксировано и покрывает бизнес-требование | Да / Нет | Да / Нет | |", null], [73, "| Функциональная спецификация имеет структурированное описание (по стандарту, шаблону) | Да / Нет | Да / Нет | |", null], [74, "| Sequence-диаграммы, предусмотрены взаимодействия систем, компонентов и решений | Да / Нет / Не требуется | Да / Нет / Не требуется | |", null], [75, "| Требование покрывает спецификацию UX/UI дизайна | Да / Нет / Не требуется | Да / Нет / Не требуется | |", null], [76, "| Реализация задачи/проекта предусматривает схему отката решений | Да / Нет / Не требуется | Да / Нет / Не требуется | При невозможности отката — варианты скрытия функционала |", null], [77, "| Требование может быть протестировано | Да / Нет | Да / Нет | |", null], [78, "| Требование предусматривает модель данных или поток, содержит описание | Да / Нет / Не требуется | Да / Нет / Не требуется | |", null], [79, "| Требование не имеет противоречий или явных показателей операционных рисков | Да / Нет | Да / Нет | |", null], [80, "| Требование содержит архитектуру и согласовано с архитекторами | Да / Нет / Не требуется | Да / Нет / Не требуется | Для архитектуры — чек-лист |", null], [81, "| Все изменения, влияющие на иные продукты/системы в требовании, согласованы с ответственными лицами | Да / Нет / Не требуется | Да / Нет / Не требуется | |", null], [82, "| Структура требований не несёт изменений и рисков информационной безопасности | Да / Нет | Да / Нет | По информационной безопасности — чек-лист |", null], [83, "| В требовании присутствует схема полного бизнес-процесса и часть реализуемой доработки | Да / Нет | Да / Нет | |", null], [84, "| Требование носит интеграционный характер и имеет четкую постановку реализации интеграционного взаимодействия | Да / Нет / Не требуется | Да / Нет / Не требуется | |", null], [85, "| Поддерживается версионность "", null], [128, "### Схема", null], [129, "```text", null], [130, "Приложение → AlertsController → хранилище настроек → AlertsController → приложение.", null], [131, "```", null], [132, "", null], [133, "### Параметры запроса", null], [134, "", null], [135, "#### Path-параметры", null], [136, "Не используются.", null], [137, "", null], [138, "#### Query-параметры", null], [139, "", null], [140, "| Parameter | Format | Size | Mandatory | Logic | Description | DB field |", null], [141, "| :--- | :--- | :--- | :--- | :--- | :--- | :--- |", null], [142, "| `cardId` | string | 1–64 | Да | Карта клиента | Идентификатор карты | `card_id` |", null], [143, "| `amount` | integer | 32 bit | Да | 1 000–1 000 000 | Порог в тенге | `limit_kzt` |", null], [144, "| `enabled` | integer | 1 знак | Да | 0 или 1 | Признак включения | `enabled` |", null], [145, "", null], [146, "#### Request body", null], [147, "* **Content-Type:** `application/json` .", null], [148, "* Тело не используется.", null], [149, "", null], [150, "### Ответ", null], [151, "Если результат 200 или 201 — успешный. Если результат 400, 401 и далее — неуспешный.", null], [152, "", null], [153, "| Parameter | Format | Logic | Description | DB field |", null], [154, "| :--- | :--- | :--- | :--- | :--- |", null], [155, "| `result` | string | OK / ERROR | Исход сохранения | — |", null], [156, "| `amount` | string | При успехе | Порог в тенге | `limit_kzt` |", null], [157, "| `enabled` | string | «0» или «1» | Признак включения | `enabled` |", null], [158, "| `message` | string | При ошибке | Описание ошибки | — |", null], [159, "", null], [160, "### Статусы", null], [161, "", null], [162, "**200.** Ответ в случае успешного выполнения метода.  ", null], [163, "**400.** Ответ в случае, если параметры запроса заполнены неверно.", null], [164, "", null], [165, "#### 200. Successful — Created", null], [166, "```json", null], [167, "{\"result\":\"OK\",\"amount\":\"50000\",\"enabled\":\"1\"}", null], [168, "```", null], [169, "или", null], [170, "```json", null], [171, "{\"result\":\"ERROR\",\"message\":\"Проверьте сумму\"}", null], [172, "```", null], [173, "", null], [174, "**401.** Ответ в случае, если запрос выполнен без необходимой авторизации.  ", null], [175, "**403.** Ответ в случае, если на указанный ресурс доступ запрещен.  ", null], [176, "**500.** Ответ в случае, если произошла внутренняя ошибка сервера.", null], [177, "", null], [178, "#### 400. Unsuccessful — Bad request", null], [179, "```json", null], [180, "{\"message\":\"Некорректный запрос\"}", null], [181, "```", null], [182, "", null], [183, "#### 401. Unsuccessful — Unauthorized", null], [184, "```json", null], [185, "{\"message\":\"Требуется вход\"}", null], [186, "```", null], [187, "", null], [188, "#### 403. Unsuccessful — Forbidden", null], [189, "Для чужой карты возвращается 404, как и для отсутствующей карты.  ", null], [190, "**404**", null], [191, "```json", null], [192, "{\"message\":\"Карта не найдена\"}", null], [193, "```", null], [194, "", null], [195, "#### 500. Unsuccessful — Internal server error", null], [196, "```json", null], [197, "{\"message\":\"Ошибка сервиса\"}", null], [198, "```", null]]}</script>
<script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
const R = D.report, LINES = D.lines;
const FACT = '[проверка кодом]';
const SEV = {critical:'Критичное', major:'Существенное', minor:'Незначительное'};
const SEV_ORDER = {critical:0, major:1, minor:2};
const DEF = {ambiguity:'Неоднозначность', unverifiable:'Непроверяемость', contradiction:'Противоречие',
  gap:'Пробел', design:'Проектное решение', non_singular:'Составное требование',
  traceability:'Трассируемость', other:'Корректность'};
const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

// ---- findings ----
const V = [];
(R.checks || []).forEach(c => (c.violations || []).forEach(v => V.push(Object.assign({owner: c.rid}, v))));
((R.set_check || {}).violations || []).forEach(v => V.push(Object.assign({owner: null}, v)));
V.forEach(v => {
  v.code = (v.explanation || '').startsWith(FACT);
  v.text = v.code ? v.explanation.slice(FACT.length).trim() : v.explanation;
  v.lines = [];
  [v.location, v.location2].concat(v.also_at || []).forEach(l => {
    if (l) for (let n = l.line_start; n <= l.line_end; n++) v.lines.push(n);
  });
  v.lines = [...new Set(v.lines)].sort((a, b) => a - b);
  v.ids = [...new Set([v.owner].concat(v.req_ids || []).filter(Boolean))];
});
const grouped = v => (v.also_at || []).length > 3 ? 1 : 0;
V.sort((a, b) => SEV_ORDER[a.severity] - SEV_ORDER[b.severity] || grouped(a) - grouped(b) || (a.lines[0] || 0) - (b.lines[0] || 0));
const byLine = {};
V.forEach(v => v.lines.forEach(n => (byLine[n] = byLine[n] || []).push(v)));

// ---- header ----
const P = R.passport || {}, C = R.counts || {}, VD = R.verdict || {};
$('#title').textContent = P.document_title || 'Отчёт проверки требований';
const ok = VD.ready_for_development;
$('#state').textContent = ok ? 'Можно в разработку' : 'Нельзя в разработку';
if (ok) $('#state').classList.add('ok');
$('#vsum').textContent = VD.summary || '';
const bs = C.by_severity || {};
const bank = V.filter(v => v.tag).length, qs = V.filter(v => v.fix_type === 'question').length;
[['c', bs.critical || 0, 'критичных'], ['m', bs.major || 0, 'существенных'], ['n', bs.minor || 0, 'незначительных'],
 ['k', bank, 'банк и ИБ'], ['', (R.requirements || []).length, 'требований']].forEach(([cls, n, label]) => {
  const s = el('span', cls); s.append(el('b', null, String(n)), document.createTextNode(' ' + label)); $('#tally').append(s);
});
[P.document, P.model && ('Модель: ' + P.model), P.agent_version && ('Версия агента: ' + P.agent_version),
 P.date && ('Проверено: ' + P.date.replace('T', ' ').slice(0, 16))].filter(Boolean).forEach(x => $('#meta').append(el('span', null, x)));

// ---- tabs ----
const TABS = [['v-notes', 'Документ и замечания', V.length], ['v-check', 'Чек-лист ревью', ((R.checklist || {}).items || []).length],
  ['v-q', 'Вопросы владельцу', qs], ['v-cov', 'Нет критериев приёмки', (R.coverage_gaps || []).length],
  ['v-req', 'Требования', (R.requirements || []).length]];
TABS.forEach(([id, label, n], i) => {
  if (i > 0 && !n) return;
  const b = el('button', null, label); b.setAttribute('role', 'tab'); b.dataset.view = id;
  b.setAttribute('aria-selected', i === 0 ? 'true' : 'false');
  b.append(el('span', 'cnt', String(n)));
  b.onclick = () => showTab(id);
  $('#tabs').append(b);
});
function showTab(id){
  document.querySelectorAll('.view').forEach(s => s.classList.toggle('on', s.id === id));
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', b.dataset.view === id ? 'true' : 'false'));
}

function rich(t){
  // **bold** and `code` from Markdown; everything else stays plain text.
  const f = document.createDocumentFragment();
  t.split(/(\*\*[^*]+\*\*|`[^`]+`)/).forEach(part => {
    if (/^\*\*[^*]+\*\*$/.test(part)) f.append(el('b', null, part.slice(2, -2)));
    else if (/^`[^`]+`$/.test(part)) f.append(el('code', null, part.slice(1, -1)));
    else if (part) f.append(document.createTextNode(part));
  });
  return f;
}

// ---- document ----
const doc = $('#doc'), lineEl = {};
LINES.forEach(([n, t]) => {
  const row = el('div', 'ln'); row.dataset.no = n;
  const h = /^(#+)\s/.exec(t);
  const isSep = /^\s*\|[\s|:\-]+\|?\s*$/.test(t) && t.includes('-');
  if (h) row.classList.add('h', 'h' + h[1].length);
  else if (isSep) row.classList.add('sep');
  else if (/^\s*\|/.test(t)) row.classList.add('t');
  const vs = byLine[n];
  if (vs) {
    row.classList.add('mk', vs.reduce((a, v) => SEV_ORDER[v.severity] < SEV_ORDER[a] ? v.severity : a, 'minor'));
    row.title = vs.length + ' замеч. — нажмите, чтобы показать только их';
    row.tabIndex = 0;
    row.onclick = () => pickLine(n);
    row.onkeydown = e => { if (e.key === 'Enter') pickLine(n); };
  }
  const tx = el('span', 'tx');
  if (row.classList.contains('t')) {
    t.trim().replace(/^\|/, '').replace(/\|$/, '').split(/(?<!\\)\|/).forEach(c => { const cell = el('span', 'cell'); cell.append(rich(c.trim().replace(/\\\|/g, '|'))); tx.append(cell); });
  } else if (!isSep) tx.append(rich(h ? t.slice(h[0].length) : (t || ' ')));
  row.append(el('span', 'no', String(n)), el('span', 'bar'), tx);
  doc.append(row); lineEl[n] = row;
});

// ---- minimap ----
const mm = $('#minimap'), total = LINES.length || 1;
Object.keys(byLine).forEach(n => {
  const sev = lineEl[n].classList.contains('critical') ? 'crit' : lineEl[n].classList.contains('major') ? 'major' : 'minor';
  const i = el('i'); i.style.top = ((n - 1) / total * 100) + '%'; i.style.background = 'var(--' + sev + ')'; mm.append(i);
});
function eye(){
  const e = $('#eye'), h = doc.scrollHeight || 1;
  e.style.top = (doc.scrollTop / h * 100) + '%'; e.style.height = (doc.clientHeight / h * 100) + '%';
}
doc.addEventListener('scroll', eye); window.addEventListener('resize', eye);
mm.onclick = e => { const r = mm.getBoundingClientRect(); doc.scrollTop = (e.clientY - r.top) / r.height * doc.scrollHeight - doc.clientHeight / 2; };

// ---- notes ----
const state = {sev: {critical: true, major: true, minor: true}, bank: false, q: false, text: '', line: null, sel: null};
function where(v){
  if (!v.lines.length) return 'место не найдено';
  const ls = v.lines.length > 4 ? v.lines.slice(0, 4).join(', ') + ' …' : v.lines.join(', ');
  return (v.lines.length === 1 ? 'строка ' : 'строки ') + ls;
}
function note(v){
  const n = el('article', 'note ' + v.severity); n.tabIndex = 0;
  const hd = el('div', 'hd');
  hd.append(el('span', 'sev', SEV[v.severity] || v.severity), el('span', 'kind', DEF[v.defect] || v.defect));
  if (v.tag === 'fintech') hd.append(el('span', 'tag bank', 'банковская специфика'));
  if (v.tag === 'security') hd.append(el('span', 'tag bank', 'информационная безопасность'));
  if (v.code) hd.append(el('span', 'tag', 'проверено кодом'));
  if (v.fix_type === 'question') hd.append(el('span', 'tag q', 'нужно решение'));
  if (v.ids.length) hd.append(el('span', 'tag', v.ids.slice(0, 4).join(', ') + (v.ids.length > 4 ? ' …' : '')));
  hd.append(el('span', 'where', where(v)));
  n.append(hd, el('p', null, v.text));
  const q = el('p'); q.append(el('q', null, v.quote)); n.append(q);
  if (v.quote2) { const q2 = el('p'); q2.append(el('q', null, v.quote2)); n.append(q2); }
  const fx = el('div', 'fix');
  if (v.fix_type === 'question') {
    const b = el('b', null, v.options && v.options.length ? 'Вопрос владельцу продукта: ' : 'Предложение (решает владелец продукта): ');
    fx.append(b, document.createTextNode(v.fix));
    if (v.options && v.options.length) {
      const ul = el('ul', 'opts');
      v.options.forEach((o, i) => { const li = el('li'); li.append(el('span', 'opt', 'АБВГД'[i] + ')'), document.createTextNode(o)); ul.append(li); });
      fx.append(ul);
    }
  } else { fx.append(el('b', null, 'Исправление: '), document.createTextNode(v.fix)); }
  n.append(fx);
  n.onclick = () => focusNote(v, n);
  n.onkeydown = e => { if (e.key === 'Enter') focusNote(v, n); };
  return n;
}
function visible(v){
  if (!state.sev[v.severity]) return false;
  if (state.bank && !v.tag) return false;
  if (state.q && v.fix_type !== 'question') return false;
  if (state.line != null && !v.lines.includes(state.line)) return false;
  if (state.text) {
    const hay = [v.text, v.quote, v.quote2, v.fix, (v.options || []).join(' '), v.ids.join(' '), DEF[v.defect]].join(' ').toLowerCase();
    if (!hay.includes(state.text)) return false;
  }
  return true;
}
function draw(){
  const list = $('#list'); list.textContent = '';
  const shown = V.filter(visible);
  shown.forEach(v => list.append(note(v)));
  if (!shown.length) list.append(el('p', 'empty', 'Под эти фильтры замечаний нет. Включите другие уровни критичности или очистите поиск.'));
  const pi = $('#pickinfo');
  pi.textContent = '';
  if (state.line != null) {
    pi.append(document.createTextNode('Показаны замечания к строке ' + state.line + '. '));
    const b = el('button', null, 'Показать все'); b.onclick = () => { state.line = null; mark(); draw(); }; pi.append(b);
  }
  pi.classList.toggle('on', state.line != null);
}
function clearFlash(){ document.querySelectorAll('.ln.flash').forEach(x => x.classList.remove('flash')); }
function mark(){
  document.querySelectorAll('.ln.pick').forEach(x => x.classList.remove('pick'));
  if (state.line != null && lineEl[state.line]) lineEl[state.line].classList.add('pick');
}
function goLine(n){
  const r = lineEl[n]; if (!r) return;
  r.scrollIntoView({block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
}
function focusNote(v, n){
  document.querySelectorAll('.note.sel').forEach(x => x.classList.remove('sel')); n.classList.add('sel');
  clearFlash(); v.lines.forEach(k => lineEl[k] && lineEl[k].classList.add('flash'));
  if (v.lines.length) goLine(v.lines[0]);
}
function pickLine(n){ state.line = state.line === n ? null : n; mark(); draw(); }
document.querySelectorAll('#filters .chip').forEach(b => b.onclick = () => {
  const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', String(on));
  if (b.dataset.sev) state.sev[b.dataset.sev] = on;
  if (b.dataset.src === 'bank') state.bank = on;
  if (b.dataset.src === 'q') state.q = on;
  draw();
});
$('#search').oninput = e => { state.text = e.target.value.trim().toLowerCase(); draw(); };
function goto(n){ showTab('v-notes'); clearFlash(); if (lineEl[n]) { lineEl[n].classList.add('flash'); goLine(n); } }
function gotoLink(loc){
  if (!loc) return document.createTextNode('—');
  const a = el('a', 'goto', 'строка ' + loc.line_start); a.tabIndex = 0;
  a.onclick = () => goto(loc.line_start); a.onkeydown = e => { if (e.key === 'Enter') goto(loc.line_start); };
  return a;
}
draw(); eye();

// ---- checklist ----
const CL = (R.checklist || {}).items || [];
if (CL.length) {
  const p = $('#p-check');
  p.append(el('h2', null, 'Чек-лист ревью требований'),
    el('p', 'lead', (R.checklist.source === 'document' ? 'Чек-лист «Ревью требований» взят из самого документа. ' : 'В документе чек-листа нет, использован шаблон банковского ревью. ')
      + 'Ответ «Да» ставится только при подтверждении в тексте; открытое существенное замечание по теме пункта даёт «Нет».'));
  const t = el('table', 'grid'), hr = el('tr');
  ['Проверка', 'Ответ', 'Обоснование', 'Место'].forEach(h => hr.append(el('th', null, h)));
  t.append(hr);
  CL.forEach(it => {
    const tr = el('tr'), st = {yes: ['Да', 'yes'], no: ['Нет', 'no'], 'n/a': ['Не требуется', 'na']}[it.status] || [it.status, 'na'];
    const extra = (it.refs || []).filter(r => !it.evidence.includes(r));
    const ev = el('td', null, it.evidence + (extra.length ? ' (' + extra.join(', ') + ')' : ''));
    const wh = el('td'); wh.append(gotoLink(it.location));
    tr.append(el('td', null, it.item), el('td', 'st ' + st[1], st[0]), ev, wh); t.append(tr);
  });
  p.append(t);
}

// ---- questions ----
const QV = V.filter(v => v.fix_type === 'question');
if (QV.length) {
  const p = $('#p-q');
  p.append(el('h2', null, 'Вопросы владельцу продукта'),
    el('p', 'lead', 'Эти места агент не исправляет сам: нужно бизнес-решение. Агент не подставляет значения, которых нет в документе, а предлагает варианты.'));
  const ol = el('ol', 'qlist');
  QV.forEach(v => {
    const li = el('li'); const head = el('div');
    head.append(el('b', null, v.fix + ' '));
    const loc = v.location; if (loc) { head.append(document.createTextNode('(')); head.append(gotoLink(loc)); head.append(document.createTextNode(v.ids.length ? ', ' + v.ids.join(', ') + ')' : ')')); }
    li.append(head);
    if (v.options && v.options.length) { const ul = el('ul'); v.options.forEach((o, i) => { const x = el('li'); x.append(el('span', 'opt', 'АБВГД'[i] + ')'), document.createTextNode(o)); ul.append(x); }); li.append(ul); }
    ol.append(li);
  });
  p.append(ol);
}

// ---- coverage ----
const CG = R.coverage_gaps || [];
if (CG.length) {
  const p = $('#p-cov');
  p.append(el('h2', null, 'Условия без критериев приёмки'),
    el('p', 'lead', 'Для каждого условия в документе нет проверки. Правый столбец — готовая строка для раздела «Критерии приемки».'));
  const t = el('table', 'grid'), hr = el('tr');
  ['Требование', 'Условие', 'Место', 'Предлагаемый критерий приёмки'].forEach(h => hr.append(el('th', null, h)));
  t.append(hr);
  CG.forEach(g => {
    const tr = el('tr');
    const cond = (g.condition || '').replace('Нет критерия приёмки для условия: ', '').split('. Требование покрывают')[0];
    const wh = el('td'); wh.append(gotoLink(g.location));
    tr.append(el('td', null, (g.req_ids || []).join(', ')), el('td', null, cond), wh, el('td', null, (g.fix || '').replace('Добавить критерий приёмки: ', '')));
    t.append(tr);
  });
  p.append(t);
}

// ---- requirements ----
const RQ = R.requirements || [];
if (RQ.length) {
  const p = $('#p-req');
  p.append(el('h2', null, 'Требования, найденные в документе'),
    el('p', 'lead', 'Агент сам нарезал документ на требования и дал им ID отчёта. Число замечаний — по всем проверкам.'));
  const cnt = {}; V.forEach(v => v.ids.forEach(i => cnt[i] = (cnt[i] || 0) + 1));
  const t = el('table', 'grid'), hr = el('tr');
  ['ID', 'ID в документе', 'Раздел', 'Суть', 'Место', 'Замечаний'].forEach(h => hr.append(el('th', null, h)));
  t.append(hr);
  RQ.forEach(r => {
    const tr = el('tr'); const wh = el('td'); wh.append(gotoLink(r.location));
    tr.append(el('td', null, r.rid), el('td', null, r.doc_id || '—'), el('td', null, r.section || ''), el('td', null, r.summary || r.quote), wh, el('td', null, String(cnt[r.rid] || 0)));
    t.append(tr);
  });
  p.append(t);
}
})();
</script>
</body>
</html>
